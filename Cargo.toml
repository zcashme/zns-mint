[workspace]
resolver = "2"
members = ["canon", "keygen", "migrate", "mint", "rebind"]
# non-tee is on in every integration-tests build. Outside the workspace,
# feature unification cannot carry it into a release binary.
exclude = ["integration-tests"]

# Every member builds against the ZNS forks: a Name Note is built from a
# caller-provided rseed (`unsafe-zns`), which upstream builders cannot take.
[patch.crates-io]
orchard = { git = "https://github.com/zcashme/orchard.git", tag = "zns-orchard-v0.16.0.1" }
zcash_primitives = { git = "https://github.com/zcashme/zns-zcash_primitives.git", tag = "zns-zcash_primitives-v0.31.0.1" }
