[package]
name = "zns-mint"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[features]
default = []
regtest = ["zcash_protocol/local-consensus"]

[[bin]]
name = "zns-mint"
path = "src/main.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
subtle = "2.5"
secrecy = "0.8"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Exchange price parsing: `Decimal` deserializes JSON price strings
# ("41.53") directly, so no hand-rolled decimal parser is needed.
rust_decimal = { version = "1.42", features = ["serde-with-str"] }
# `OffsetDateTime` for `SentTransaction::new` (zcash_client_backend data-api);
# same crate upstream depends on, lockfile-shared at 0.3.x.
time = "0.3"
# JSON-RPC transport over plaintext HTTP/1.1 to the local Zebra node (same
# TEE). All five crates are already compiled via tonic/gRPC — listing them as
# direct deps just makes them importable. No TLS, no reqwest, no ring.
tonic = "0.14"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
# Standard HTTPS connector for Hyper, using rustls and webpki roots.
hyper-rustls = { version = "0.27", default-features = false, features = ["aws-lc-rs", "http1", "webpki-roots"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
# `StreamExt`/`Stream` for the mempool stream adaptor. Already compiled via
# tonic — direct listing adds no code.
futures-util = "0.3"
sev = { version = "8.0.0", default-features = false, features = ["snp"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
hex = "0.4"
incrementalmerkletree = "0.8.2"

# ZNS payload (rcm, ψ) derivation: BLAKE2b-512 wide-reduced into Pallas field
# elements. Both are already transitive deps (via zcash_spec / orchard); pulling
# them direct adds no new compiled code to the graph.
blake2b_simd = "1"
pasta_curves = "0.5"

zcash_note_encryption = "0.4"

# CSPRNG for Orchard spend-auth + binding nonces in the signer. Already a
# transitive dep (orchard); pulled direct with default features so `OsRng` is
# available (orchard itself uses `default-features = false`).
rand = "0.8"

zebra-indexer-proto = "2.5"

# Key derivation (ZIP-32 Orchard)
# Treasury (account 0) is user-facing and accepts Orchard + Sapling + Transparent
# payments from users. Registry (account 1) is name-notes-only (Orchard). Both
# accounts derive all enabled pools via `from_seed`; the Registry's Sapling and
# Transparent components are unused (its address is not published).
zcash_keys = { version = "0.16.1", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol = { version = "0.10.4", default-features = false }

# Address parsing for OTP relay (extracting Orchard receiver from UA string).
# Already a transitive dep via zcash_keys; listed direct for importability.
zcash_address = "0.13.0"

# Transparent key types (Treasury accepts transparent payments from users).
# The workspace crate is `zcash_transparent`, published as `transparent`.
transparent = { package = "zcash_transparent", version = "0.10.0", default-features = false }
zip32 = "0.2.1"

# Block parsing
zcash_primitives = { version = "0.30.0", default-features = false, features = ["unsafe-zns"] }
sapling = { package = "sapling-crypto", version = "0.7", default-features = false }

# ZIP-321 payment requests for upstream proposal construction
# (`propose_transfer` consumes a `zip321::TransactionRequest`).
zip321 = "0.9.0-rc.1"

# Full-block wallet scanning. `transparent-inputs` enables transparent UTXO
# detection (Treasury accepts transparent payments from users).
zcash_client_backend = { version = "0.24.0-rc.7", default-features = false, features = ["orchard", "transparent-inputs"] }

# Orchard with the `unsafe-zns` feature: Name Notes override the standard
# note commitment so a note commits to a ZNS payload. The fork lives at
# https://github.com/zcashme/orchard and is unified with the librustzcash
# graph via the [patch.crates-io] git tag. zns-mint calls
# `Builder::add_zns_output` / `add_zns_spend` directly, so this is a
# first-class dep, not just a transitive one.
orchard = { version = "0.15.5", default-features = false, features = ["unsafe-zns", "circuit"] }
shardtree = "0.7.1"


# Also redirect `zcash_primitives` to the ZNS fork so the transaction
# Builder can compose Name Notes (add_zns_spend / add_zns_output).
[patch.crates-io]
orchard = { git = "https://github.com/zcashme/orchard.git", tag = "zns-orchard-v0.15.5.2" }
zcash_primitives = { git = "https://github.com/zcashme/zns-zcash_primitives.git", tag = "zns-zcash_primitives-v0.30.1.2" }

# Upstream ZIP-316 unified test vectors for the key-derivation regression
# tests (`zcash_address::test_vectors::UNIFIED` is gated behind the crate's
# `test-dependencies` feature). Dev-only; never part of a release build.
[dev-dependencies]
zcash_address = { version = "0.13.0", features = ["test-dependencies"] }
