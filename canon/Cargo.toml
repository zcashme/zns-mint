[package]
name = "zns-canon"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[features]
default = []
# Dev-only FakeTee (release-blocked in lib.rs).
fake-tee = []

[dependencies]
attestation-verify = "0.1"
blake2b_simd = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hex = "0.4"
postcard = { version = "1", default-features = false, features = ["alloc"] }
rand = "0.8"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
sev = { version = "8.0.0", default-features = false, features = ["snp", "crypto_nossl"] }
sha2 = "0.10"
thiserror = "1"
tracing = "0.1"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
zip32 = "0.2.1"
