[package]
name = "zns-integration-tests"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "Cross-stack harness for ZNS: zebra, mint, resolver"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
