# Lint this crate; claim e2e (zebrad + FakeTee mint) on PRs and main.
#
# The claim job publishes a FakeTee ceremony + Treasury, installs Sapling
# params, and runs mint. Price fetch uses live HTTPS. The signed ceremony
# tx is cached across runs (deterministic regtest chain), skipping the
# ~18 min Halo2 proof on cache hits.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  ZEBRAD_VERSION: "6.3.0"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: zns-integration-tests
    steps:
      - uses: actions/checkout@v4
        with:
          path: zns-integration-tests

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: zns-integration-tests

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: test (lib)
        run: cargo test --lib

  claim:
    name: claim
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: zns-integration-tests
    steps:
      - uses: actions/checkout@v4
        with:
          path: zns-integration-tests

      - name: Checkout zns-mint
        uses: actions/checkout@v4
        with:
          repository: zcashme/zns-mint
          path: zns-mint

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            zns-integration-tests
            zns-mint

      - name: Install zebrad
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          asset="zebrad-${ZEBRAD_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/ZcashFoundation/zebra/releases/download/v${ZEBRAD_VERSION}"
          curl -fsSL -O "${base}/${asset}"
          curl -fsSL -O "${base}/${asset}.sha256"
          sha256sum -c "${asset}.sha256"
          tar -xzf "${asset}"
          bin="$(find . -maxdepth 3 -type f -name zebrad | head -n 1)"
          test -n "$bin"
          chmod +x "$bin"
          echo "ZEBRAD_BIN=${GITHUB_WORKSPACE}/${bin#./}" >> "$GITHUB_ENV"

      - name: Cache Sapling params
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/zcash-params
          key: sapling-params-spend-47958396-output-3592860

      - name: Fetch Sapling params
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p zcash-params
          base="https://download.z.cash/downloads"
          spend="zcash-params/sapling-spend.params"
          output="zcash-params/sapling-output.params"
          if [[ ! -f "$spend" || "$(stat -c%s "$spend")" -ne 47958396 ]]; then
            curl -L --fail -o "$spend" "${base}/sapling-spend.params"
          fi
          if [[ ! -f "$output" || "$(stat -c%s "$output")" -ne 3592860 ]]; then
            curl -L --fail -o "$output" "${base}/sapling-output.params"
          fi
          test "$(stat -c%s "$spend")" -eq 47958396
          test "$(stat -c%s "$output")" -eq 3592860

      - name: Cache ceremony tx
        # The regtest chain through FIXTURE_HEIGHT is deterministic, so a
        # ceremony tx signed on an earlier run replays without re-proving.
        # Key on everything that shapes the chain or the tx itself; a miss
        # costs one slow run and re-seeds the cache.
        uses: actions/cache@v4
        with:
          path: zns-integration-tests/ceremony-tx.hex
          key: ceremony-tx-v2-${{ env.ZEBRAD_VERSION }}-${{ hashFiles('zns-integration-tests/src/**', 'zns-integration-tests/tests/**', 'zns-integration-tests/Cargo.lock') }}

      - name: claim
        env:
          ZNS_MINT_DIR: ${{ github.workspace }}/zns-mint
          ZCASH_PARAMS_DIR: ${{ github.workspace }}/zcash-params
          ZNS_CEREMONY_TX_CACHE: ceremony-tx.hex
        run: cargo test --test claim -- --nocapture
