[package]
name = "zns-keygen"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = []
testnet = []

[[bin]]
name = "zns-keygen"
path = "src/main.rs"

[dependencies]
blake2b_simd = "1.0.4"
hex = "0.4.3"
hmac = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "3", features = ["static_secrets", "zeroize"] }
zeroize = "1.9.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secrecy = "0.8"
zns-canon = { path = "../canon" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

zcash_protocol = { version = "0.11", default-features = false }
zcash_address = "0.14"
zcash_primitives = { version = "0.31", default-features = false, features = ["transparent-inputs"] }
sapling = { package = "sapling-crypto", version = "0.9", default-features = false }
orchard = { version = "0.16.0", default-features = false, features = ["circuit"] }
transparent = { package = "zcash_transparent", version = "0.11", default-features = false }
# `Receiver::Transparent` encodes the Treasury t-address; zcash_transparent
# 0.11 no longer does.
zcash_keys = { version = "0.17", default-features = false }
zip32 = "0.3"
rand = "0.10"
secp256k1 = "0.33"
zcash_script = "0.6"

[dev-dependencies]
toml = "1"
zcash_keys = { version = "0.17", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
