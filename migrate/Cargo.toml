[package]
name = "zns-migrate"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[features]
default = []

[dependencies]
blake2b_simd = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hex = "0.4"
libc = "0.2"
rand = "0.8"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
zns-canon = { git = "https://github.com/zcashme/zns-canon.git", branch = "main" }
