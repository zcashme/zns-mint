[package]
name = "zns-migrate"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[features]
default = []
# Development TEE. zns-canon refuses this feature in release builds.
fake-tee = ["dep:sha2", "zns-canon/fake-tee"]

[dependencies]
blake2b_simd = "1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hex = "0.4"
rand = "0.8"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", optional = true }
thiserror = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
zns-canon = { path = "../zns-canon" }
