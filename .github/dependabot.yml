# Dependabot configuration for the ZNS workspace.
#
# The orchard and zcash_primitives forks are git tags in the root
# [patch.crates-io]; updating them is a deliberate, reviewed change and
# is not done here. Only crates.io dependencies and action versions are.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"                 # workspace: canon, keygen, migrate, mint
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"

  - package-ecosystem: "cargo"
    directory: "/integration-tests" # outside the workspace, own Cargo.lock
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"                 # workflow action versions
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
