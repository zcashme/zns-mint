# Tests, clippy, rustfmt, docs, and coverage on PRs and master.
# A failing test or a new clippy warning turns the PR red.
# Cargo commands pass --locked, so a manifest change has to update Cargo.lock.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  ci:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: rustfmt
        run: cargo fmt --check

      # Network features are mutually exclusive (lib.rs compile_error), so
      # clippy runs every supported combination explicitly. --all-features
      # would enable testnet and regtest together and fail by design.
      - name: clippy (default)
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: clippy (testnet)
        run: cargo clippy --locked --all-targets --features testnet -- -D warnings

      - name: clippy (regtest)
        run: cargo clippy --locked --all-targets --features regtest -- -D warnings

      - name: test (default)
        run: cargo test --locked

      - name: test (regtest)
        run: cargo test --locked --features regtest

      - name: docs
        run: cargo doc --locked --no-deps

      - name: coverage
        run: |
          cargo llvm-cov --locked --features regtest --html --output-dir coverage
          cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            lcov.info
            coverage/
          if-no-files-found: error

  # Boot → claim → update → release in one run. Needs ci, so unit
  # failures skip it. The ceremony is re-proved every run: a random
  # funding txid cannot be cached.
  e2e:
    name: e2e (boot to happy path)
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # zebra-indexer-proto (tonic/prost) needs protoc at build time.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # zallet-zebra reads zebrad's state directly; Zebra 7 writes format
      # v29, which no zallet release reads yet. Move to the first release
      # that does.
      - name: Checkout zallet
        uses: actions/checkout@v4
        with:
          repository: zcash/zallet
          ref: aec7f3fa8397ef17b2852dc6835572d6e623b1a2
          path: zallet

      - name: Cache cargo registry and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            integration-tests -> target
            zallet/backends/zebra -> target

      - name: Download zebrad and Sapling params
        run: |
          mkdir -p "$RUNNER_TEMP/zebrad" "$RUNNER_TEMP/params"
          cd "$RUNNER_TEMP/zebrad"
          base="https://github.com/ZcashFoundation/zebra/releases/download/v7.0.0"
          asset="zebrad-7.0.0-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -O "$base/$asset" -O "$base/$asset.sha256"
          sha256sum -c "$asset.sha256"
          tar -xzf "$asset"
          find . -maxdepth 3 -type f -name zebrad -exec mv {} ./zebrad \;
          chmod +x ./zebrad
          for p in sapling-spend.params sapling-output.params; do
            curl -L --fail -o "$RUNNER_TEMP/params/$p" "https://download.z.cash/downloads/$p"
          done
          echo "ZEBRAD_BIN=$RUNNER_TEMP/zebrad/zebrad" >> "$GITHUB_ENV"
          echo "ZCASH_PARAMS_DIR=$RUNNER_TEMP/params" >> "$GITHUB_ENV"

      - name: Build zallet (zebra backend)
        working-directory: zallet/backends/zebra
        run: |
          cargo build --locked --release
          echo "ZALLET_BIN=$PWD/target/release/zallet-zebra" >> "$GITHUB_ENV"

      - name: rustfmt (integration)
        working-directory: integration-tests
        run: cargo fmt --check

      - name: clippy (integration)
        working-directory: integration-tests
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build mint for e2e
        run: |
          cargo \
            --config profile.dev.package.orchard.opt-level=3 \
            --config profile.dev.package.halo2_proofs.opt-level=3 \
            --config profile.dev.package.halo2_gadgets.opt-level=3 \
            build --locked --bin zns-mint --features regtest
          test -x target/debug/zns-mint
          echo "ZNS_MINT_BIN=$PWD/target/debug/zns-mint" >> "$GITHUB_ENV"

      - name: boot to happy path
        working-directory: integration-tests
        env:
          ZNS_MINT_DIR: ${{ github.workspace }}
        run: cargo test --locked --test happy_path -- --nocapture
