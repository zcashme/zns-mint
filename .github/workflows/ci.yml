# Tests, clippy, rustfmt and docs on PRs and master. A failing test or a
# new clippy warning turns the PR red.
# Cargo commands pass --locked, so a manifest change has to update Cargo.lock.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: rustfmt (workspace)
        run: cargo fmt --all --check

      - name: rustfmt (integration-tests)
        working-directory: integration-tests
        run: cargo fmt --check

  # Clippy and Test each cover the whole workspace, so the shared
  # dependency graph compiles once per job. A cargo invocation unifies
  # features across the packages it builds, so each pass names only
  # packages whose features may meet: no default feature turns on canon's
  # non-tee, and mint's regtest turns it on anyway. The network features
  # are mutually exclusive within a crate, so --all-features would fail
  # by design. keygen compiles only on x86_64 Linux with RDSEED.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: clippy (default)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: clippy (testnet)
        run: cargo clippy --locked -p zns-mint -p zns-keygen --all-targets --features zns-mint/testnet,zns-keygen/testnet -- -D warnings

      - name: clippy (regtest, non-tee)
        run: cargo clippy --locked -p zns-mint -p zns-canon --all-targets --features zns-mint/regtest,zns-canon/non-tee -- -D warnings

      - name: docs
        run: cargo doc --locked --workspace --no-deps

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: test (default)
        run: cargo test --locked --workspace

      - name: test (mint regtest)
        run: cargo test --locked -p zns-mint --features regtest

      - name: test (canon non-tee)
        run: cargo test --locked -p zns-canon --features non-tee

      - name: test (keygen testnet)
        run: cargo test --locked -p zns-keygen --features testnet

  # Whether a pull request touches anything the integration tests build:
  # the mint, canon, the harness, or the workspace's build inputs. keygen
  # and migrate are not part of it.
  changes:
    name: Check changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            e2e:
              - 'mint/**'
              - 'canon/**'
              - 'integration-tests/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

  # Boot → claim → update → release in one run. Needs Test, so unit
  # failures skip it. The ceremony is re-proved every run: a random
  # funding txid cannot be cached. A push to master always runs it.
  e2e:
    name: Integration tests
    needs: [test, changes]
    if: github.event_name == 'push' || needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # zallet-zebra reads zebrad's state directly; Zebra 7 writes format
    # v29, which no zallet release reads yet. Move to the first release
    # that does.
    env:
      ZALLET_REF: aec7f3fa8397ef17b2852dc6835572d6e623b1a2
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # zebra-indexer-proto (tonic/prost) needs protoc at build time.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      # The built binary is cached under its pinned commit, so zallet is
      # checked out and compiled only when ZALLET_REF changes. A cold
      # release build takes more than ten minutes, so the binary is saved
      # as soon as it exists, not at the end of a job that may fail.
      - name: Restore zallet binary
        id: zallet
        uses: actions/cache/restore@v4
        with:
          path: zallet-bin
          key: zallet-zebra-${{ runner.os }}-${{ env.ZALLET_REF }}

      - name: Checkout zallet
        if: steps.zallet.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: zcash/zallet
          ref: ${{ env.ZALLET_REF }}
          path: zallet

      - name: Cache cargo registry and targets
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            integration-tests -> target

      - name: Download zebrad and Sapling params
        run: |
          mkdir -p "$RUNNER_TEMP/zebrad" "$RUNNER_TEMP/params"
          cd "$RUNNER_TEMP/zebrad"
          base="https://github.com/ZcashFoundation/zebra/releases/download/v7.0.0"
          asset="zebrad-7.0.0-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -O "$base/$asset" -O "$base/$asset.sha256"
          sha256sum -c "$asset.sha256"
          tar -xzf "$asset"
          find . -maxdepth 3 -type f -name zebrad -exec mv {} ./zebrad \;
          chmod +x ./zebrad
          for p in sapling-spend.params sapling-output.params; do
            curl -L --fail -o "$RUNNER_TEMP/params/$p" "https://download.z.cash/downloads/$p"
          done
          echo "ZEBRAD_BIN=$RUNNER_TEMP/zebrad/zebrad" >> "$GITHUB_ENV"
          echo "ZCASH_PARAMS_DIR=$RUNNER_TEMP/params" >> "$GITHUB_ENV"

      - name: Build zallet (zebra backend)
        if: steps.zallet.outputs.cache-hit != 'true'
        working-directory: zallet/backends/zebra
        run: |
          cargo build --locked --release
          mkdir -p "$GITHUB_WORKSPACE/zallet-bin"
          cp target/release/zallet-zebra "$GITHUB_WORKSPACE/zallet-bin/"

      - name: Save zallet binary
        if: steps.zallet.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: zallet-bin
          key: ${{ steps.zallet.outputs.cache-primary-key }}

      - name: Use the zallet binary
        run: |
          test -x zallet-bin/zallet-zebra
          echo "ZALLET_BIN=$PWD/zallet-bin/zallet-zebra" >> "$GITHUB_ENV"

      - name: clippy
        working-directory: integration-tests
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test (lib)
        working-directory: integration-tests
        run: cargo test --locked --lib

      - name: Build mint for e2e
        run: |
          cargo \
            --config profile.dev.package.orchard.opt-level=3 \
            --config profile.dev.package.halo2_proofs.opt-level=3 \
            --config profile.dev.package.halo2_gadgets.opt-level=3 \
            build --locked -p zns-mint --bin zns-mint --features regtest
          test -x target/debug/zns-mint
          echo "ZNS_MINT_BIN=$PWD/target/debug/zns-mint" >> "$GITHUB_ENV"

      - name: boot to happy path
        working-directory: integration-tests
        run: cargo test --locked --test happy_path -- --nocapture
