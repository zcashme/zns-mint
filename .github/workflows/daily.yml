# End-to-end suites too slow for the pull-request gate. Pull requests run
# only the happy path (ci.yml); these run once a day on master and on a
# manual run.
name: Daily

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  reorg:
    name: Reorg
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: ./.github/actions/e2e-setup

      - name: reorg queues
        working-directory: integration-tests
        run: cargo test --locked --test reorg -- --nocapture
