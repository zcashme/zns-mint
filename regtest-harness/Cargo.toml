[package]
name = "zns-mint-regtest-harness"
version = "0.0.0"
edition = "2021"
publish = false
description = "End-to-end regtest integration harness for zns-mint"

[workspace]

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "fs", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"

[dev-dependencies]
zcash_keys = { version = "0.16.1", default-features = false, features = ["orchard", "sapling", "transparent-inputs"] }
zcash_protocol = { version = "0.10.2", default-features = false, features = ["local-consensus"] }
zcash_address = "0.13.0"
zip32 = "0.2.1"

[dev-dependencies.orchard]
path = "/Users/jules/ZcashNames/zns-orchard"
default-features = false
features = ["unsafe-zns"]

[patch.crates-io]
orchard = { path = "/Users/jules/ZcashNames/zns-orchard" }
